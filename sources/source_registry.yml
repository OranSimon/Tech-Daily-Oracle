public_apis:
  hacker_news:
    top_stories: "https://hacker-news.firebaseio.com/v0/topstories.json"
    item: "https://hacker-news.firebaseio.com/v0/item/{id}.json"
    notes: "No API key required"

  arxiv:
    base_url: "https://export.arxiv.org/api/query"
    notes: "Rate limit: 3 req/sec, be polite"

  github_trending:
    base_url: "https://api.github.com"
    notes: "GITHUB_TOKEN strongly recommended"

  hugging_face:
    daily_papers: "https://huggingface.co/api/daily_papers"
    trending_models: "https://huggingface.co/api/models?sort=trending&limit=20"
    notes: "HF_TOKEN recommended for higher rate limits"

  sec_edgar:
    full_text_search: "https://efts.sec.gov/LATEST/search-index?q={query}&dateRange=custom&startdt={start}&enddt={end}"
    notes: "Set User-Agent header with SEC_USER_EMAIL"
