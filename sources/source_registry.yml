# Source Registry — RSS Feeds and High-Quality URLs

# Source priority tiers:
# 1 = official company / paper / filing / repo
# 2 = conference official page / reputable tech media
# 3 = specialist analyst / researcher
# 4 = social media / community
# 5 = aggregated blogs

