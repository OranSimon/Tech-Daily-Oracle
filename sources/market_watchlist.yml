# Market Signal Watchlist
# Tickers tracked by the MarketSignalAgent (Phase 4+)
#
# settings.only_on_event_day — if true, a ticker is only analyzed when a
#   matching company event appears in today's company_analyses with
#   importance >= min_importance_to_trigger. Set false to generate a signal
#   for every ticker every day (much noisier; not recommended for daily use).
#
# settings.max_tickers_per_run — caps the number of tickers analyzed per
#   daily run. When more tickers qualify, the ones with the highest company
#   analysis importance are prioritized.

settings:
  only_on_event_day: true
  min_importance_to_trigger: 0.55
  max_tickers_per_run: 5

tickers:
  # --- AI Infrastructure / Semiconductors ---
  - ticker: NVDA
    company: Nvidia
    sector: semiconductors
    horizon: "2–8 weeks"
    why_tracked: "GPU supply is the binding rate-limiter for all AI capex; H100/H200/B200 demand proxy"

