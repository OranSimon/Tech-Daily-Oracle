# Tech Daily Agent — Configuration

run:
  timezone: "Asia/Shanghai"
  daily_hour: 7
  weekly_day: "friday"
  weekly_hour: 18
  monthly_day: "last_workday"
  report_window_hours: 24
  language: "zh-CN"
  report_reading_time_target_minutes: 20

model:
  default: "claude-sonnet-4-6"
  fast: "claude-haiku-4-5-20251001"
  deep: "claude-opus-4-7"
  # These are starting budgets. claude_client.py auto-continues on truncation,
  # so even if a report exceeds these, the final output won't be cut mid-sentence.
  # Higher initial budgets just mean fewer continuation API calls per run.
  # Chinese reports use ~1.5 tokens/char, so daily=16K handles ~10K Chinese chars.
  max_tokens_daily: 16000
  max_tokens_weekly: 24000
  max_tokens_monthly: 32000

# AI provider fallback chain
# First provider with a valid API key is tried; on failure the next is attempted.
# Change "order" to rearrange or disable providers (remove from list to skip entirely).
ai_providers:
  order: ["claude", "gpt", "gemini"]

  claude:
    default: "claude-sonnet-4-6"
    fast:    "claude-haiku-4-5-20251001"
    deep:    "claude-opus-4-7"

  gpt:
    default: "gpt-5.5"           # current flagship: 1M context, strong reasoning
    fast:    "gpt-5.4-nano"      # cheapest GPT-5-class, high-volume simple calls
    deep:    "gpt-5.5"           # no separate pro tier; flagship handles deep tasks

  gemini:
    default: "gemini-2.5-flash"       # stable release, best price/performance
    fast:    "gemini-2.5-flash-lite"  # stable, cheapest Gemini option
    deep:    "gemini-3.1-pro-preview" # most capable available (preview, production-grade)

trending:
  enabled: true
  top_n: 5                   # top N items per source per period shown in reports

  ossinsight:
    # OSSInsight REST API — public endpoint, no auth required for trending
    # https://api.ossinsight.io/v1/repos/trending
    # period is mapped automatically: daily→past_24_hours, weekly→past_week, monthly→past_month
    enabled: true
    languages: []            # [] = all languages; e.g. ["Python", "TypeScript"] to filter

  huggingface:
    papers: true             # daily editorial papers; rolling window via date aggregation
    models: true             # HF's internal ~7-day trending score (sort=trending)
    # Note: monthly model trending uses stored daily snapshots (data/trending_snapshots.jsonl)
    # rather than a native HF monthly endpoint, which does not exist.

sources:
  github_trending:
    enabled: true
    languages: []          # empty = all languages
    time_range: "daily"    # daily | weekly | monthly
    top_n: 25              # fetch top N then filter to top 3 high-signal

  hacker_news:
    enabled: true
    top_stories: 50
    min_score: 100

  hugging_face:
    enabled: true
    daily_papers: true
    trending_models: true
    trending_spaces: false

  arxiv:
    enabled: true
    categories:
      - "cs.AI"
      - "cs.LG"
      - "cs.RO"
      - "cs.CV"
      - "cs.CL"
    max_results_per_category: 20
    days_back: 2

  rss:
    enabled: true
    feeds_file: "sources/source_registry.yml"

  web_search:
    enabled: true
    queries_per_run: 15
    results_per_query: 5

github:
  repo: "OranSimon/Tech-Daily-Oracle"                 # owner/repo — set after initial push
  branch: "main"
  reports_path: "reports"
  data_path: "data"

notion:
  enabled: true           # set to true after adding credentials
  database_id: "35ba03826676805f9a91c0291b790f4e"          # NOTION_DATABASE_ID env var or set here

predictions:
  daily_normal: 3          # predictions to generate on normal days
  daily_low_signal: 1
  daily_high_signal: 6
  open_prediction_warning_threshold: 30

github_project_filter:
  top_n_per_report: 3
  min_stars_total: 50
  min_star_growth_weekly: 100

output:
  save_raw_events: true
  save_normalized_events: true
  save_topic_summaries: true
  publish_notion: true
  push_github: true       # set to true in production

sec:
  user_email: "[EMAIL_ADDRESS]"           # SEC_USER_EMAIL env var

# Minimum data requirements before each review tier runs.
# If thresholds are not met the script exits cleanly with a notice (no error).
review_guards:
  min_daily_for_weekly: 3        # need ≥ N daily reports in the current week
  min_weekly_for_monthly: 2      # need ≥ N weekly reviews in the target month
  min_daily_for_monthly: 10      # OR ≥ N daily reports (either condition is enough)
