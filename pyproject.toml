[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-daily-oracle"
version = "0.1.0"
description = "Personal technology intelligence pipeline"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.116.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "pydantic>=2.7.0",
  "openai>=2.44.0",
  "google-genai>=2.13.0",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.8",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[tool.setuptools]
py-modules = []
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]

[tool.tech_daily.quality]
stable_paths = [
  "tests",
  "src/tech_daily/__init__.py",
  "src/tech_daily/cli/__init__.py",
  "src/tech_daily/cli/daily_parser.py",
