[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-daily-oracle"
version = "0.1.0"
description = "Personal technology intelligence pipeline"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "pydantic>=2.7.0",
  "openai>=1.30.0",
  "google-generativeai>=0.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.8",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]

[tool.tech_daily.quality]
stable_paths = [
  "tests",
  "scripts/config_models.py",
  "scripts/collectors/retry.py",
  "scripts/collectors/telemetry.py",
  "scripts/pipeline_errors.py",
  "scripts/pipeline_policy.py",
  "scripts/pipeline_state.py",
  "scripts/pipeline_step.py",
  "scripts/run_context.py",
  "scripts/run_logging.py",
  "scripts/storage_io.py",
  "scripts/storage_validation.py",
]

[tool.mypy]
python_version = "3.11"
files = [
  "scripts/config_models.py",
  "scripts/collectors/retry.py",
  "scripts/collectors/telemetry.py",
  "scripts/pipeline_errors.py",
  "scripts/pipeline_policy.py",
  "scripts/pipeline_state.py",
  "scripts/pipeline_step.py",
  "scripts/run_context.py",
  "scripts/run_logging.py",
  "scripts/storage_io.py",
  "scripts/storage_validation.py",
]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = true
no_implicit_optional = true
