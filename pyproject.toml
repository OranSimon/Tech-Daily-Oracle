warn_return_any = true

[[tool.mypy.overrides]]
module = ["tech_daily.reports.*"]
check_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["tech_daily.storage.*"]
check_untyped_defs = true
warn_return_any = true
