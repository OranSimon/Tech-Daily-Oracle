name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Define quality scope
        run: |
          cat > quality-paths.txt <<'EOF'
          tests
          scripts/config_models.py
          scripts/collectors/retry.py
          scripts/collectors/telemetry.py
          scripts/pipeline_errors.py
          scripts/pipeline_policy.py
          scripts/pipeline_state.py
          scripts/pipeline_step.py
          scripts/run_context.py
          scripts/run_logging.py
          scripts/storage_io.py
          scripts/storage_validation.py
          EOF

      - name: Ruff format check
        run: xargs ruff format --check < quality-paths.txt

      - name: Ruff lint
        run: xargs ruff check < quality-paths.txt

      - name: Compile scripts
        run: python -m compileall -q scripts

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -q
