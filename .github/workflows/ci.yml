name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Define quality scope
        run: python -m tech_daily.quality_paths > quality-paths.txt

      - name: Ruff format check
        run: xargs ruff format --check < quality-paths.txt

      - name: Ruff lint
        run: xargs ruff check < quality-paths.txt

      - name: Compile scripts
        run: python -m compileall -q scripts

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -q
