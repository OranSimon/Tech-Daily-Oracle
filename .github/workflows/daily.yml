name: Tech Daily Brief

# Runs every day at 21:00 UTC = 05:00 CST next morning.
# Reports on the PREVIOUS CST day's events (run_daily anchors to Asia/Shanghai).

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Run date (YYYY-MM-DD), default: yesterday'
        required: false
        type: string
      force:
        description: 'Regenerate even if report already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run daily agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SEC_USER_EMAIL: ${{ secrets.SEC_USER_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.run_date }}"
          fi
          FORCE_ARG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          python -u scripts/run_daily.py $DATE_ARG $FORCE_ARG

      - name: Commit and push report
        run: |
          git config user.name "Tech Daily Agent"
          git config user.email "actions@github.com"
          git add reports/daily/ data/
          git diff --staged --quiet || git commit -m "chore: daily brief $(date +%Y-%m-%d)"
          git push
