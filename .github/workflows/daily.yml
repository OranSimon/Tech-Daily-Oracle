name: DeepSeek Daily Retry

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Retry archived report date (2026-10-23)'
        required: false
        type: string
      force:
        description: 'Compatibility input; retry always regenerates'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deepseek-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install production dependencies
        run: python -m pip install -e .
      - name: Regenerate archived 2026-10-23 daily report with DeepSeek only
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -u scripts/retry_daily_deepseek.py
      - name: Save report and sanitized trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-daily-2026-10-23
          path: retry-output/
          if-no-files-found: error
          retention-days: 30
