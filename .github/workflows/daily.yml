name: Tech Daily API Diagnostics

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Diagnostic reference date (does not generate or publish a report)'
        required: false
        type: string
      force:
        description: 'Unused compatibility input'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic dependencies
        run: python -m pip install 'httpx>=0.27.0' 'pyyaml>=6.0.2'
      - name: Probe existing API access (sanitized output only)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u scripts/diagnose_api_access.py --compact-report
