name: Tech Daily Brief

on:
  schedule:
    # Weekdays at 23:00 UTC = ~07:00 CST next day
    - cron: '0 23 * * 1-5'
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Run date (YYYY-MM-DD), default: today'
        required: false
        type: string

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SEC_USER_EMAIL: ${{ secrets.SEC_USER_EMAIL }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.run_date }}"
          fi
          python -u scripts/run_daily.py $DATE_ARG

      - name: Commit and push report
        run: |
          git config user.name "Tech Daily Agent"
          git config user.email "actions@github.com"
          git add reports/daily/ data/
          git diff --staged --quiet || git commit -m "chore: daily brief $(date +%Y-%m-%d)"
          git push
