name: Tech Monthly Review

# Runs on the 1st of each month at 23:00 UTC.
# By this time all of the previous month's daily reports (last day at 21:00 UTC)
# and the last weekly review (last Friday at 22:00 UTC + runtime) are committed.
# The monthly script defaults month_str to the previous calendar month automatically.
# Guard: skips cleanly if the previous month has fewer than 2 weekly reviews
#        AND fewer than 10 daily reports.

on:
  schedule:
    - cron: '0 23 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month string e.g. 2026-05 (default: previous month)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run monthly review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          MONTH_ARG=""
          if [ -n "${{ github.event.inputs.month }}" ]; then
            MONTH_ARG="--month ${{ github.event.inputs.month }}"
          fi
          python -u scripts/run_monthly_review.py $MONTH_ARG

      - name: Commit and push review
        run: |
          git config user.name "Tech Daily Agent"
          git config user.email "actions@github.com"
          git add reports/monthly/ data/
          git diff --staged --quiet || git commit -m "chore: monthly review $(date +%Y-%m)"
          git push
